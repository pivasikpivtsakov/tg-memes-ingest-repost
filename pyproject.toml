[project]
name = "tg-memes-ingest-repost"
version = "0.1.0"
description = ""
authors = [{ name = "pivasikpivtsakov", email = "elda250@live.com" }]
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "telethon>=1.41.2,<2",
    "pydantic>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "python-crontab>=3.3.0,<4",
    "croniter>=6.0.0,<7",
    "json5>=0.12.1,<0.13",
    "colorlog>=6.9.0,<7",
    "boto3>=1.40.48,<2",
    "sqlalchemy>=2.0.44,<3",
    "tiktok-uploader>=1.1.5,<2",
    "redis>=8.0.1,<9",
    "av>=18.1.0,<19",
    "aiogram[i18n]>=3.28.2",
    "pgvector>=0.5.1,<0.6",
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "open-clip-torch>=3.3,<4",
    "transformers>=5.20,<6",
    "safetensors>=0.8,<1",
    "rapidocr>=3.10,<4",
    "onnxruntime-gpu[cuda,cudnn]>=1.31,<2",
    "fastapi>=0.162.0,<0.163",
    "uvicorn>=0.54.0,<0.55",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.32,<0.1",
    "pyjwt>=2.15.1,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.92",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",   # import errors and syntax that actually breaks
    "E7",
    "E9",
    "F",     # undefined names, unused imports and variables
    "UP",    # outdated typing and syntax (Optional, List, Dict, ...)
    "B",     # likely bugs: mutable defaults, raise from, zip
    "SIM",   # nested or roundabout constructs
    "C4",    # unnecessary list/dict wrappers
    "C90",   # cyclomatic complexity
    "RUF",   # ruff-specific bug checks
    "PIE",   # unnecessary or misleading constructs
    "RET",   # unreachable or inconsistent returns
    "PLE",   # pylint errors: bad except order, logging arity
    "ASYNC", # missing await and blocking calls in async code
    "S",     # suspicious subprocess and similar calls
    "ISC",   # implicit string concatenation
    "LOG",   # logging calls with the wrong arguments
    "NPY",   # deprecated numpy aliases
    "PLR1722",  # sys.exit, not the site builtin exit
]
ignore = [
    "SIM105",  # try/except/pass is easier to read than contextlib.suppress
    "SIM108",  # if/else stays easier to read than a ternary
    "SIM116",  # a dict lookup hides branches that an if-chain shows
    "RET504",  # a named variable before return is easier to follow
    "RUF001",  # ambiguous unicode: Russian text and meme captions
    "RUF002",
    "RUF003",
    "RUF022",  # __all__ stays in the order the module is read
    "B027",    # empty methods are optional hooks, not forgotten abstract methods
]

[tool.ruff.lint.per-file-ignores]
# Path bootstrap has to run before the first-party imports.
"scripts/search_memes.py" = ["E402"]
# `column == False` is a SQL expression. `not column` is not.
"shared/db/**/*.py" = ["E712"]

[tool.ruff.lint.mccabe]
# The sender is the most branched function that should stay in one piece.
max-complexity = 12

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
# Infer return types of functions that have no annotation.
return-type-inference = "always"
# Stubs for these packages describe unions and overloads that do not match
# the runtime we actually call. Treat them as Any so diagnostics stay in our code.
replace-imports-with-any = [
    "telethon.**",
    "av.**",
    "rapidocr.**",
    "open_clip.**",
    "sqlalchemy.engine.**",
]

[tool.ty.rules]
# Names used after a branch that may not have assigned them.
possibly-unresolved-reference = "error"
division-by-zero = "error"
