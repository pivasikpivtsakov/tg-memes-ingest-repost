<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <title>Поиск мемов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
          integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
          crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    html {
      color-scheme: light;
      background: var(--tg-theme-header-bg-color, var(--tg-theme-bg-color, #fff));
    }
    body {
      margin: 0;
      min-height: 100dvh;
      font: 16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--tg-theme-secondary-bg-color, #efeff4);
      color: var(--tg-theme-text-color, #000);
      overflow-x: hidden;
    }
    body.viewer-open { overflow: hidden; }
    .dock-slot {
      position: sticky;
      top: 0;
      z-index: 25;
      padding: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px) + 12px) 12px 12px;
    }
    .dock {
      padding: 6px;
      border-radius: 22px;
      border: 1px solid color-mix(in srgb, var(--tg-theme-text-color, #000) 12%, transparent);
      background: rgba(0, 0, 0, 0.22);
      box-shadow: 0 10px 28px color-mix(in srgb, #000 18%, transparent);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      backdrop-filter: blur(18px) saturate(1.4);
    }
    #status { margin: 4px 8px; overflow-wrap: anywhere; }
    #status[hidden] { display: none; }
    #search { display: flex; align-items: center; gap: 8px; }
    #search[hidden] { display: none; }
    #search input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      font: inherit;
      border: 0;
      border-radius: 16px;
      /* Android header pills are a 22% black scrim with white icons. A text field stays lighter. */
      background: color-mix(in srgb, var(--tg-theme-text-color, #000) 4%, var(--tg-theme-header-bg-color, #fff));
      color: inherit;
    }
    #search input::placeholder { color: var(--tg-theme-hint-color, #999); }
    .icon-btn, .channel {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      height: 44px;
      font: inherit;
      border: 0;
      border-radius: 16px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn { width: 44px; padding: 0; }
    .channel {
      gap: 6px;
      padding: 0 14px;
      white-space: nowrap;
      background: color-mix(in srgb, var(--tg-theme-button-color, #2481cc) 14%, transparent);
      color: var(--tg-theme-link-color, var(--tg-theme-button-color, #2481cc));
    }
    .channel .icon { width: 18px; height: 18px; }
    .icon-btn:disabled { opacity: 0.5; }
    .icon-btn:active, .channel:active { transform: scale(0.96); }
    .icon-btn:focus-visible, .channel:focus-visible, #search input:focus-visible {
      outline: 2px solid var(--tg-theme-button-color, #2481cc);
      outline-offset: 2px;
    }
    main {
      padding: 0 12px calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px) + 16px);
      min-width: 0;
    }
    .hint, .timings { color: var(--tg-theme-hint-color, #8e8e93); font-size: 13px; }
    .timings { margin: 0 4px 10px; }
    .hits { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
    .card {
      min-width: 0;
      overflow: hidden;
      border-radius: 18px;
      background: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fff));
      box-shadow: 0 1px 2px color-mix(in srgb, #000 14%, transparent);
      padding-bottom: 12px;
    }
    .empty, .error { margin: 0; padding: 14px; overflow-wrap: anywhere; }
    .error { color: var(--tg-theme-destructive-text-color, #d00); }
    .media {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 70vh;
      background: #111;
      cursor: pointer;
    }
    .media img, .media video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      pointer-events: none;
    }
    .expand {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(0, 0, 0, .55);
      color: #fff;
      pointer-events: none;
    }
    .expand .icon { width: 16px; height: 16px; }
    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(0, 0, 0, .45);
      box-shadow: 0 2px 12px rgba(0, 0, 0, .35);
      color: #fff;
      pointer-events: none;
    }
    .play .icon { width: 28px; height: 28px; transform: translateX(2px); }
    .pending {
      display: none;
      align-items: center;
      gap: 8px;
      margin: 8px 8px 2px;
      color: var(--tg-theme-text-color, #000);
      font-size: 14px;
    }
    .pending.htmx-request { display: flex; }
    .sprite { position: absolute; width: 0; height: 0; }
    .icon { width: 22px; height: 22px; display: block; flex: none; }
    .spinner { width: 18px; height: 18px; animation: spin .7s linear infinite; }
    #search .spinner, .pending .spinner { display: none; }
    #search.htmx-request .icon-search { display: none; }
    #search.htmx-request .spinner, .pending.htmx-request .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
    .card-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 0;
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .meta { flex: 1; min-width: 0; margin: 0; overflow-wrap: anywhere; font-size: 14px; }
    .scores {
      width: 100%;
      margin-top: 8px;
      font-size: 13px;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: left;
    }
    .scores th, .scores td { padding: 2px 12px; overflow-wrap: anywhere; }
    .scores th { color: var(--tg-theme-hint-color, #8e8e93); font-weight: normal; }
    .ocr {
      margin: 8px 12px 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
      font-size: 15px;
    }
    .empty { padding-bottom: 14px; }
    #viewer {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding:
        calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px) + 8px)
        calc(var(--tg-safe-area-inset-right, 0px) + 12px)
        calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px) + 12px)
        calc(var(--tg-safe-area-inset-left, 0px) + 12px);
      background: #000;
      color: #fff;
    }
    #viewer[hidden] { display: none; }
    .viewer-bar { display: flex; justify-content: space-between; gap: 8px; }
    #viewer .viewer-bar .icon-btn {
      border-radius: 50%;
      background: rgba(255, 255, 255, .16);
      color: #fff;
    }
    #viewer .icon-btn:focus-visible { outline-color: #fff; }
    .viewer-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-stage img, .viewer-stage video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .viewer-stage [hidden] { display: none !important; }
  </style>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21 21-4.34-4.34"/>
        <circle cx="11" cy="11" r="8"/>
      </g>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15V3"/>
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <path d="m7 10 5 5 5-5"/>
      </g>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18"/>
        <path d="m6 6 12 12"/>
      </g>
    </symbol>
    <symbol id="i-loader" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </g>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path fill="currentColor" d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>
    </symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
        <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      </g>
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6"/>
        <path d="M10 14 21 3"/>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      </g>
    </symbol>
  </svg>
  <div class="dock-slot">
    <header class="dock">
      <p id="status" class="hint">Вход…</p>
      <form id="search" hidden
            hx-post="api/search" hx-target="#results" hx-swap="innerHTML"
            hx-vals='{"limit": 30}'
            hx-indicator="#pending, #search"
            hx-disabled-elt="#search button">
        <input name="query" type="search" required autocomplete="off" enterkeyhint="search" placeholder="Текст, шаблон или сцена">
        <button type="submit" class="icon-btn" aria-label="Найти">
          <svg class="icon icon-search" aria-hidden="true"><use href="#i-search"/></svg>
          <svg class="icon spinner" aria-hidden="true"><use href="#i-loader"/></svg>
        </button>
      </form>
      <p id="pending" class="pending" role="status"><svg class="icon spinner" aria-hidden="true"><use href="#i-loader"/></svg>Ищем…</p>
    </header>
  </div>
  <main id="results"></main>
  <div id="viewer" hidden>
    <div class="viewer-bar">
      <button type="button" id="viewer-close" class="icon-btn" aria-label="Закрыть">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
      <button type="button" id="viewer-save" class="icon-btn" aria-label="Скачать">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
      </button>
    </div>
    <div class="viewer-stage">
      <img id="viewer-img" alt="" hidden>
      <video id="viewer-video" controls playsinline webkit-playsinline hidden></video>
    </div>
  </div>
  <script>
    const fullScreenPlatforms = ['ios', 'android', 'android_x'];
    const tgWebApp = window.Telegram?.WebApp;
    const statusLine = document.getElementById('status');
    const form = document.getElementById('search');
    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewer-img');
    const viewerVideo = document.getElementById('viewer-video');
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    let token = null;
    let viewerFile = null;

    function themeColor(name, fallback) {
      const value = tgWebApp?.themeParams?.[name];
      return typeof value === 'string' && value ? value : fallback;
    }

    function syncChrome() {
      const scheme = tgWebApp?.colorScheme === 'dark' ? 'dark' : 'light';
      const header = themeColor('header_bg_color', themeColor('bg_color', scheme === 'dark' ? '#1c1c1d' : '#ffffff'));
      const page = themeColor('secondary_bg_color', themeColor('bg_color', scheme === 'dark' ? '#0f0f0f' : '#efeff4'));
      document.documentElement.style.colorScheme = scheme;
      themeMeta.content = header;
      tgWebApp?.setHeaderColor?.(header);
      tgWebApp?.setBackgroundColor?.(page);
      tgWebApp?.setBottomBarColor?.(themeColor('bottom_bar_bg_color', page));
    }

    function viewerChrome() {
      document.documentElement.style.colorScheme = 'dark';
      themeMeta.content = '#000000';
      tgWebApp?.setHeaderColor?.('#000000');
      tgWebApp?.setBackgroundColor?.('#000000');
    }

    function attachmentUrl(url, fileName) {
      const safeName = fileName.replace(/["\\]/g, '');
      const value = `attachment; filename="${safeName}"`;
      const sep = url.includes('?') ? '&' : '?';
      // Telegram saves the file only when the response says it is an attachment.
      return `${url}${sep}response-content-disposition=${encodeURIComponent(value)}`;
    }

    function openPublic(url) {
      if (typeof tgWebApp?.openTelegramLink === 'function') {
        tgWebApp.openTelegramLink(url);
        return;
      }
      location.assign(url);
    }

    function saveFile(url, name) {
      const fileName = (name || '').trim() || 'meme';
      const href = attachmentUrl(url, fileName);
      try {
        if (typeof tgWebApp?.downloadFile === 'function' && tgWebApp.isVersionAtLeast?.('8.0')) {
          tgWebApp.downloadFile({ url: href, file_name: fileName });
          return;
        }
      } catch {
        // client older than Bot API 8.0, or a download popup is already open
      }
      if (typeof tgWebApp?.openLink === 'function') {
        tgWebApp.openLink(href);
        return;
      }
      location.assign(href);
    }

    function openViewer(url, kind, name) {
      viewerFile = { url, name };
      if (kind === 'video') {
        viewerImg.hidden = true;
        viewerImg.removeAttribute('src');
        viewerVideo.hidden = false;
        viewerVideo.src = url;
        viewerVideo.play().catch(() => {});
      } else {
        viewerVideo.pause();
        viewerVideo.removeAttribute('src');
        viewerVideo.load();
        viewerVideo.hidden = true;
        viewerImg.hidden = false;
        viewerImg.src = url;
      }
      viewer.hidden = false;
      document.body.classList.add('viewer-open');
      viewerChrome();
      tgWebApp?.BackButton?.show();
    }

    function closeViewer() {
      if (viewer.hidden) return;
      viewer.hidden = true;
      viewerFile = null;
      viewerImg.removeAttribute('src');
      viewerImg.hidden = true;
      viewerVideo.pause();
      viewerVideo.removeAttribute('src');
      viewerVideo.load();
      viewerVideo.hidden = true;
      document.body.classList.remove('viewer-open');
      tgWebApp?.BackButton?.hide();
      syncChrome();
    }

    syncChrome();
    if (tgWebApp) {
      tgWebApp.onEvent?.('themeChanged', () => {
        if (viewer.hidden) syncChrome();
      });
      tgWebApp.disableVerticalSwipes?.();
      tgWebApp.expand();
      try {
        if (fullScreenPlatforms.includes(tgWebApp.platform)) {
          tgWebApp.requestFullscreen();
        }
      } catch {
        // requestFullscreen not supported (Bot API < 8.0)
      }
      tgWebApp.BackButton?.onClick(closeViewer);
      tgWebApp.ready();
    }

    function showAuthError(message) {
      statusLine.textContent = message;
      statusLine.className = 'error';
    }

    async function authenticate() {
      const initData = tgWebApp?.initData ?? '';
      try {
        const response = await fetch('api/auth/telegram?' + new URLSearchParams({ init_data: initData }));
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = typeof body.detail === 'string' ? body.detail : '';
          const outsideTelegram = !initData && detail === 'Missing init_data';
          showAuthError(
            outsideTelegram
              ? 'Откройте приложение из Telegram'
              : (detail || `Ошибка входа: ${response.status}`),
          );
          return;
        }
        token = body.token;
        statusLine.hidden = true;
        form.hidden = false;
      } catch (e) {
        showAuthError(`Ошибка входа: ${e.message}`);
      }
    }

    document.body.addEventListener('click', (event) => {
      const channel = event.target.closest('[data-channel]');
      if (channel) {
        event.stopPropagation();
        openPublic(channel.dataset.channel);
        return;
      }
      const download = event.target.closest('[data-download]');
      if (download) {
        event.stopPropagation();
        saveFile(download.dataset.download, download.dataset.name);
        return;
      }
      const opener = event.target.closest('[data-open]');
      if (opener) openViewer(opener.dataset.open, opener.dataset.kind, opener.dataset.name);
    });
    document.body.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeViewer();
        return;
      }
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const opener = event.target.closest?.('[data-open]');
      if (!opener) return;
      event.preventDefault();
      openViewer(opener.dataset.open, opener.dataset.kind, opener.dataset.name);
    });
    document.getElementById('viewer-close').addEventListener('click', closeViewer);
    document.getElementById('viewer-save').addEventListener('click', () => {
      if (viewerFile) saveFile(viewerFile.url, viewerFile.name);
    });
    viewer.addEventListener('click', (event) => {
      if (event.target === viewer || event.target.classList.contains('viewer-stage')) closeViewer();
    });

    document.body.addEventListener('htmx:configRequest', (event) => {
      if (token) event.detail.headers['Authorization'] = `Bearer ${token}`;
    });
    document.body.addEventListener('htmx:beforeSwap', (event) => {
      if (event.detail.xhr.status === 401) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
      }
    });
    document.body.addEventListener('htmx:afterSwap', (event) => {
      if (event.detail.target.id === 'results') window.scrollTo(0, 0);
    });

    authenticate();
  </script>
</body>
</html>
