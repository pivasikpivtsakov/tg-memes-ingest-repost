<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <title>Поиск мемов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
          integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
          crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root {
      /* Telegram Android draws fullscreen controls at insets + 8dp (BotFullscreenButtons). */
      --edge: 8px;
      --fade: 22px;
      --page-left: calc(var(--tg-safe-area-inset-left, 0px) + var(--tg-content-safe-area-inset-left, 0px) + var(--edge));
      --page-right: calc(var(--tg-safe-area-inset-right, 0px) + var(--tg-content-safe-area-inset-right, 0px) + var(--edge));
    }
    html {
      color-scheme: light;
      background: var(--tg-theme-header-bg-color, var(--tg-theme-bg-color, #fff));
    }
    body {
      margin: 0;
      min-height: 100dvh;
      font: 16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--tg-theme-secondary-bg-color, #efeff4);
      color: var(--tg-theme-text-color, #000);
      overflow-x: clip;
    }
    /* CSS has no per-pixel blur radius (Apple uses one GPU shader). These are compositor
       backdrop-filter layers: stronger blur only covers the top, so it fades out.
       Blur is paid for the whole box; the mask is clear past --z, so the box stops there. */
    .veil {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;
      height: var(--veil-h, 120px);
      pointer-events: none;
    }
    .veil > div { position: absolute; inset: 0; }
    .veil > div:not(.veil-tint) {
      bottom: auto;
      height: calc(var(--z) + 2px);
      -webkit-backdrop-filter: blur(var(--b)) saturate(1.15);
      backdrop-filter: blur(var(--b)) saturate(1.15);
      -webkit-mask-image: linear-gradient(to bottom, #000 var(--a), transparent var(--z));
      mask-image: linear-gradient(to bottom, #000 var(--a), transparent var(--z));
      /* Stops stay in veil coordinates; default mask-position is center. */
      -webkit-mask-size: 100% var(--veil-h, 120px);
      mask-size: 100% var(--veil-h, 120px);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: top;
      mask-position: top;
    }
    .veil > div:nth-child(1) { --b: 1px; --a: 42%; --z: 68%; }
    .veil > div:nth-child(2) { --b: 2px; --a: 30%; --z: 54%; }
    .veil > div:nth-child(3) { --b: 5px; --a: 16%; --z: 40%; }
    .veil > div:nth-child(4) { --b: 10px; --a: 0%; --z: 28%; }
    .veil > div:nth-child(5) { --b: 18px; --a: 0%; --z: 16%; }
    .veil-tint {
      background: linear-gradient(
        to bottom,
        color-mix(in srgb, var(--tg-theme-header-bg-color, #fff) 78%, transparent),
        color-mix(in srgb, var(--tg-theme-header-bg-color, #fff) 30%, transparent) 34%,
        transparent 70%
      );
    }
    @media (prefers-reduced-transparency: reduce) {
      .veil > div:not(.veil-tint) { display: none; }
      .veil-tint {
        background: linear-gradient(
          to bottom,
          var(--tg-theme-header-bg-color, #fff),
          color-mix(in srgb, var(--tg-theme-header-bg-color, #fff) 88%, transparent) 72%,
          transparent
        );
      }
    }
    .dock-slot {
      position: sticky;
      top: 0;
      z-index: 25;
      padding:
        calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px) + var(--edge))
        var(--page-right) 0 var(--page-left);
    }
    #status { margin: 4px 2px 8px; overflow-wrap: anywhere; }
    .hint { color: var(--tg-theme-hint-color, #8e8e93); font-size: 14px; }
    #search { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
    #search input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      font: inherit;
      border: 0;
      border-radius: 16px;
      background: var(--tg-theme-header-bg-color, #fff);
      background: color-mix(in srgb, var(--tg-theme-text-color, #000) 5%, var(--tg-theme-header-bg-color, #fff));
      color: var(--tg-theme-text-color, #000);
    }
    #search input::placeholder { color: var(--tg-theme-hint-color, #999); }
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .btn .icon { width: 22px; height: 22px; }
    .btn:active { transform: scale(0.94); }
    .btn:disabled { opacity: 0.45; }
    .btn:focus-visible, #search input:focus-visible, .tile:focus-visible {
      outline: 2px solid var(--tg-theme-button-color, #2481cc);
      outline-offset: 2px;
    }
    .btn[aria-pressed="true"] { background: rgba(255, 255, 255, 0.92); color: #111; }
    .pending {
      display: none;
      align-items: center;
      gap: 6px;
      margin: 0 2px 8px;
      color: var(--tg-theme-hint-color, #8e8e93);
      font-size: 13px;
    }
    .pending.htmx-request { display: flex; }
    main {
      padding:
        var(--fade) var(--page-right)
        calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px) + 16px)
        var(--page-left);
      min-width: 0;
    }
    .timings { margin: 0 2px 8px; color: var(--tg-theme-hint-color, #8e8e93); font-size: 13px; }
    .empty { margin: 12px 2px; }
    .error { margin: 0; color: var(--tg-theme-destructive-text-color, #d00); overflow-wrap: anywhere; }
    #hits { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-items: start; }
    #hits.ready { display: block; position: relative; }
    .tile {
      position: relative;
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 6px;
      overflow: hidden;
      background: color-mix(in srgb, var(--tg-theme-text-color, #000) 8%, transparent);
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #hits.ready .tile { position: absolute; }
    .tile img, .tile video {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    #hits.ready .tile img, #hits.ready .tile video { height: 100%; object-fit: cover; }
    .tile:active { opacity: 0.88; }
    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24);
      pointer-events: none;
    }
    .play .icon { width: 16px; height: 16px; transform: translateX(1px); }
    .more {
      display: grid;
      place-items: center;
      height: 36px;
      margin: 4px 0 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--tg-theme-hint-color, #8e8e93);
    }
    .more .spinner { visibility: hidden; }
    .more.htmx-request .spinner { visibility: visible; }
    .sprite { position: absolute; width: 0; height: 0; }
    .icon { width: 18px; height: 18px; display: block; flex: none; pointer-events: none; }
    .spinner { animation: spin .7s linear infinite; }
    #search .spinner { display: none; }
    #search.htmx-request .icon-search { display: none; }
    #search.htmx-request .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #viewer {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: #000;
      color: #fff;
      touch-action: none;
      overscroll-behavior: none;
    }
    /* Fly-off keeps the node full-screen; without this the next tap hits it and sticks. */
    #viewer.dismissed { pointer-events: none; }
    #viewer.settling { transition: background-color .18s linear; }
    #viewer.dragging, #viewer.dragging #viewer-frame, #viewer.dragging .viewer-chrome { transition: none; }
    #viewer.settling #viewer-frame { transition: transform .18s ease; }
    #viewer.settling .viewer-chrome { transition: opacity .18s ease; }
    .viewer-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #viewer-frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }
    #viewer-frame img, #viewer-frame video {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .viewer-chrome { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .viewer-bar, #viewer-info { pointer-events: auto; }
    .viewer-query {
      position: absolute;
      top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px) + var(--edge));
      left: var(--page-left);
      right: var(--page-right);
      width: fit-content;
      max-width: calc(100% - var(--page-left) - var(--page-right));
      margin: 0 auto;
      padding: 6px 12px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      overflow-wrap: anywhere;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
    .viewer-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px var(--page-right) calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px) + 8px) var(--page-left);
    }
    .viewer-actions { display: flex; gap: 8px; }
    #viewer .btn:focus-visible { outline-color: #fff; }
    #viewer-info {
      position: absolute;
      left: var(--page-left);
      right: var(--page-right);
      bottom: calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px) + 60px);
      max-height: min(42vh, 320px);
      overflow: auto;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.55);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      font-size: 14px;
      line-height: 1.35;
      touch-action: pan-y;
      user-select: text;
      -webkit-user-select: text;
    }
    #viewer-info p { margin: 0; overflow-wrap: anywhere; }
    #viewer-info p + p { margin-top: 8px; }
    #viewer-meta, #viewer-ranks { color: rgba(255, 255, 255, 0.78); }
    #viewer-ocr { white-space: pre-line; }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      #viewer.settling, #viewer.settling #viewer-frame, #viewer.settling .viewer-chrome { transition: none; }
    }
  </style>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21 21-4.34-4.34"/>
        <circle cx="11" cy="11" r="8"/>
      </g>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15V3"/>
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <path d="m7 10 5 5 5-5"/>
      </g>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18"/>
        <path d="m6 6 12 12"/>
      </g>
    </symbol>
    <symbol id="i-loader" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </g>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path fill="currentColor" d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6"/>
        <path d="M10 14 21 3"/>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      </g>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4"/>
        <path d="M12 8h.01"/>
      </g>
    </symbol>
  </svg>
  <div class="veil" aria-hidden="true">
    <div></div><div></div><div></div><div></div><div></div>
    <div class="veil-tint"></div>
  </div>
  <div class="dock-slot">
    <p id="status" class="hint">Вход…</p>
    <form id="search" hidden
          hx-post="api/search" hx-target="#results" hx-swap="innerHTML"
          hx-vals='{"limit": 20, "offset": 0}'
          hx-indicator="#pending, #search"
          hx-disabled-elt="#search button">
      <input name="query" type="search" required autocomplete="off" enterkeyhint="search" placeholder="Текст, шаблон или сцена">
      <button type="submit" class="btn" aria-label="Найти">
        <svg class="icon icon-search" aria-hidden="true"><use href="#i-search"/></svg>
        <svg class="icon spinner" aria-hidden="true"><use href="#i-loader"/></svg>
      </button>
    </form>
    <p id="pending" class="pending" role="status"><svg class="icon spinner" aria-hidden="true"><use href="#i-loader"/></svg>Ищем…</p>
  </div>
  <main id="results"></main>
  <div id="viewer" hidden>
    <div class="viewer-stage" id="viewer-stage">
      <div id="viewer-frame">
        <img id="viewer-img" alt="" hidden>
        <video id="viewer-video" controls playsinline webkit-playsinline hidden></video>
      </div>
    </div>
    <div class="viewer-chrome" id="viewer-chrome">
      <p id="viewer-query" class="viewer-query" hidden></p>
      <div id="viewer-info" hidden>
        <p id="viewer-meta"></p>
        <p id="viewer-ranks"></p>
        <p id="viewer-ocr"></p>
      </div>
      <div class="viewer-bar">
        <button type="button" id="viewer-close" class="btn" aria-label="Закрыть">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
        <div class="viewer-actions">
          <button type="button" id="viewer-public" class="btn" aria-label="В паблик" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>
          </button>
          <button type="button" id="viewer-info-btn" class="btn" aria-label="О меме" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>
          </button>
          <button type="button" id="viewer-save" class="btn" aria-label="Скачать">
            <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const fullScreenPlatforms = ['ios', 'android', 'android_x'];
    const GAP = 4;
    const tgWebApp = window.Telegram?.WebApp;
    const statusLine = document.getElementById('status');
    const form = document.getElementById('search');
    const slot = document.querySelector('.dock-slot');
    const viewer = document.getElementById('viewer');
    const stage = document.getElementById('viewer-stage');
    const frame = document.getElementById('viewer-frame');
    const chrome = document.getElementById('viewer-chrome');
    const viewerImg = document.getElementById('viewer-img');
    const viewerVideo = document.getElementById('viewer-video');
    const info = document.getElementById('viewer-info');
    const infoBtn = document.getElementById('viewer-info-btn');
    const publicBtn = document.getElementById('viewer-public');
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let token = null;
    let viewerFile = null;
    let viewerPublic = null;
    let viewerKind = 'image';
    let lockedScroll = 0;
    let paging = false;
    let laidWidth = -1;
    let layoutQueued = false;
    let dismissTimer = 0;
    let scale = 1;
    let tx = 0;
    let ty = 0;
    let gesture = null;
    const pointers = new Map();

    function themeColor(name, fallback) {
      const value = tgWebApp?.themeParams?.[name];
      return typeof value === 'string' && value ? value : fallback;
    }

    function syncChrome() {
      const scheme = tgWebApp?.colorScheme === 'dark' ? 'dark' : 'light';
      const header = themeColor('header_bg_color', themeColor('bg_color', scheme === 'dark' ? '#1c1c1d' : '#ffffff'));
      const page = themeColor('secondary_bg_color', themeColor('bg_color', scheme === 'dark' ? '#0f0f0f' : '#efeff4'));
      document.documentElement.style.colorScheme = scheme;
      themeMeta.content = header;
      tgWebApp?.setHeaderColor?.(header);
      tgWebApp?.setBackgroundColor?.(page);
      tgWebApp?.setBottomBarColor?.(themeColor('bottom_bar_bg_color', page));
    }

    function viewerChrome() {
      document.documentElement.style.colorScheme = 'dark';
      themeMeta.content = '#000000';
      tgWebApp?.setHeaderColor?.('#000000');
      tgWebApp?.setBackgroundColor?.('#000000');
    }

    function syncVeil() {
      const bar = form.querySelector('input');
      const cover = bar.offsetHeight
        ? bar.getBoundingClientRect().bottom + bar.offsetHeight / 2
        : slot.getBoundingClientRect().bottom;
      // .veil-tint is clear at 70%, so the box has to run past the cover line.
      document.documentElement.style.setProperty('--veil-h', `${cover / 0.7}px`);
    }

    function attachmentUrl(url, fileName) {
      const safeName = fileName.replace(/["\\]/g, '');
      const value = `attachment; filename="${safeName}"`;
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}response-content-disposition=${encodeURIComponent(value)}`;
    }

    function openPublic(url) {
      if (typeof tgWebApp?.openTelegramLink === 'function') {
        tgWebApp.openTelegramLink(url);
        return;
      }
      location.assign(url);
    }

    function saveFile(url, name) {
      const fileName = (name || '').trim() || 'meme';
      const href = attachmentUrl(url, fileName);
      try {
        if (typeof tgWebApp?.downloadFile === 'function' && tgWebApp.isVersionAtLeast?.('8.0')) {
          tgWebApp.downloadFile({ url: href, file_name: fileName });
          return;
        }
      } catch {
        // client older than Bot API 8.0, or a download popup is already open
      }
      if (typeof tgWebApp?.openLink === 'function') {
        tgWebApp.openLink(href);
        return;
      }
      location.assign(href);
    }

    function lockScroll() {
      if (document.body.style.position === 'fixed') return;
      lockedScroll = window.scrollY;
      document.body.style.position = 'fixed';
      document.body.style.top = `-${lockedScroll}px`;
      document.body.style.left = '0';
      document.body.style.right = '0';
      document.body.style.width = '100%';
    }

    function unlockScroll() {
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      document.body.style.width = '';
      window.scrollTo(0, lockedScroll);
      relayoutIfWidthChanged();
    }

    function resetZoom() {
      scale = 1;
      tx = 0;
      ty = 0;
      gesture = null;
      pointers.clear();
      window.clearTimeout(dismissTimer);
      viewer.classList.remove('dragging', 'settling', 'dismissed');
      frame.style.transform = '';
      viewer.style.backgroundColor = '';
      chrome.style.opacity = '';
    }

    function setLine(id, value) {
      const node = document.getElementById(id);
      node.textContent = value || '';
      node.hidden = !node.textContent;
    }

    function openViewer(opener) {
      viewerFile = { url: opener.dataset.open, name: opener.dataset.name };
      viewerPublic = opener.dataset.public || null;
      viewerKind = opener.dataset.kind || 'image';
      publicBtn.hidden = !viewerPublic;
      setLine('viewer-query', opener.closest('#hits')?.dataset.query || '');
      setLine('viewer-meta', opener.dataset.meta);
      setLine('viewer-ranks', opener.dataset.ranks);
      setLine('viewer-ocr', opener.dataset.ocr);
      info.hidden = true;
      infoBtn.setAttribute('aria-pressed', 'false');
      resetZoom();
      if (viewerKind === 'video') {
        viewerImg.hidden = true;
        viewerImg.removeAttribute('src');
        viewerVideo.hidden = false;
        viewerVideo.src = opener.dataset.open;
        viewerVideo.play().catch(() => {});
      } else {
        viewerVideo.pause();
        viewerVideo.removeAttribute('src');
        viewerVideo.load();
        viewerVideo.hidden = true;
        viewerImg.hidden = false;
        viewerImg.src = opener.dataset.open;
      }
      viewer.hidden = false;
      lockScroll();
      viewerChrome();
      tgWebApp?.BackButton?.show();
    }

    function closeViewer() {
      if (viewer.hidden) return;
      window.clearTimeout(dismissTimer);
      viewer.hidden = true;
      viewerFile = null;
      viewerPublic = null;
      info.hidden = true;
      resetZoom();
      viewerImg.removeAttribute('src');
      viewerImg.hidden = true;
      viewerVideo.pause();
      viewerVideo.removeAttribute('src');
      viewerVideo.load();
      viewerVideo.hidden = true;
      unlockScroll();
      tgWebApp?.BackButton?.hide();
      syncChrome();
    }

    function render(extraY = 0) {
      frame.style.transform = `translate(${tx}px, ${ty + extraY}px) scale(${scale})`;
    }

    function fitted() {
      const media = viewerImg.hidden ? viewerVideo : viewerImg;
      const rect = stage.getBoundingClientRect();
      const nw = media.naturalWidth || media.videoWidth || rect.width || 1;
      const nh = media.naturalHeight || media.videoHeight || rect.height || 1;
      const fit = Math.min(rect.width / nw, rect.height / nh);
      return { w: nw * fit, h: nh * fit, rect };
    }

    function clampPan() {
      if (scale <= 1.001) {
        scale = 1;
        tx = 0;
        ty = 0;
        return;
      }
      const { w, h, rect } = fitted();
      const maxX = Math.max(0, (w * scale - rect.width) / 2);
      const maxY = Math.max(0, (h * scale - rect.height) / 2);
      tx = Math.min(maxX, Math.max(-maxX, tx));
      ty = Math.min(maxY, Math.max(-maxY, ty));
    }

    function zoomAt(clientX, clientY, next) {
      const rect = stage.getBoundingClientRect();
      const focalX = clientX - rect.left - rect.width / 2;
      const focalY = clientY - rect.top - rect.height / 2;
      const nextScale = Math.min(4, Math.max(1, next));
      if (nextScale === 1) {
        scale = 1;
        tx = 0;
        ty = 0;
        render();
        return;
      }
      const k = nextScale / scale;
      tx = focalX * (1 - k) + tx * k;
      ty = focalY * (1 - k) + ty * k;
      scale = nextScale;
      clampPan();
      render();
    }

    function onVideoControls(event) {
      if (event.target !== viewerVideo || viewerVideo.hidden) return false;
      const rect = viewerVideo.getBoundingClientRect();
      return event.clientY > rect.bottom - 48;
    }

    function releaseViewer(pointerType) {
      viewer.classList.add('dismissed');
      if (pointerType === 'touch') {
        const blockTouchEnd = (event) => {
          event.preventDefault();
          stage.removeEventListener('touchend', blockTouchEnd);
        };
        stage.addEventListener('touchend', blockTouchEnd, { passive: false });
        window.setTimeout(() => stage.removeEventListener('touchend', blockTouchEnd), 0);
      }
      // Drop only the swipe's compatibility click; the next pointerdown is a real tap.
      const stop = (event) => {
        if (event?.type === 'click') {
          event.preventDefault();
          event.stopPropagation();
        }
        document.removeEventListener('click', stop, true);
        document.removeEventListener('pointerdown', stop, true);
      };
      document.addEventListener('click', stop, true);
      document.addEventListener('pointerdown', stop, true);
      window.setTimeout(stop, 500);
    }

    function settleDismiss(dy, pointerType) {
      viewer.classList.remove('dragging');
      if (Math.abs(dy) > 100) {
        releaseViewer(pointerType);
        if (reduceMotion) {
          closeViewer();
          return;
        }
        const sign = dy < 0 ? -1 : 1;
        viewer.classList.add('settling');
        requestAnimationFrame(() => {
          frame.style.transform = `translateY(${sign * window.innerHeight}px)`;
          chrome.style.opacity = '0';
          viewer.style.backgroundColor = 'transparent';
        });
        dismissTimer = window.setTimeout(closeViewer, 180);
        return;
      }
      viewer.classList.add('settling');
      requestAnimationFrame(() => {
        render(0);
        chrome.style.opacity = '';
        viewer.style.backgroundColor = '';
      });
    }

    stage.addEventListener('pointerdown', (event) => {
      if (viewer.hidden || onVideoControls(event)) return;
      try { stage.setPointerCapture(event.pointerId); } catch { /* pointer already gone */ }
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      viewer.classList.add('dragging');
      viewer.classList.remove('settling');
      if (pointers.size >= 2) {
        const [a, b] = [...pointers.values()];
        gesture = {
          type: 'pinch',
          dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
          scale, tx, ty,
          focalX: (a.x + b.x) / 2,
          focalY: (a.y + b.y) / 2,
        };
        return;
      }
      gesture = { type: 'pending', x: event.clientX, y: event.clientY, tx, ty, dismiss: 0, moved: false };
    });

    stage.addEventListener('pointermove', (event) => {
      if (!pointers.has(event.pointerId) || !gesture) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (gesture.type === 'pinch' && pointers.size >= 2) {
        const [a, b] = [...pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        const rect = stage.getBoundingClientRect();
        const focalX = (a.x + b.x) / 2 - rect.left - rect.width / 2;
        const focalY = (a.y + b.y) / 2 - rect.top - rect.height / 2;
        const startFocalX = gesture.focalX - rect.left - rect.width / 2;
        const startFocalY = gesture.focalY - rect.top - rect.height / 2;
        const nextScale = Math.min(4, Math.max(1, gesture.scale * dist / gesture.dist));
        const k = gesture.scale === 0 ? 1 : nextScale / gesture.scale;
        scale = nextScale;
        tx = startFocalX * (1 - k) + gesture.tx * k + (focalX - startFocalX);
        ty = startFocalY * (1 - k) + gesture.ty * k + (focalY - startFocalY);
        if (scale === 1) { tx = 0; ty = 0; }
        clampPan();
        render();
        return;
      }
      if (gesture.type !== 'pending' && gesture.type !== 'dismiss' && gesture.type !== 'pan') return;
      const dx = event.clientX - gesture.x;
      const dy = event.clientY - gesture.y;
      if (gesture.type === 'pending') {
        if (Math.hypot(dx, dy) < 8) return;
        gesture.moved = true;
        gesture.type = scale > 1 ? 'pan' : (Math.abs(dy) > Math.abs(dx) ? 'dismiss' : 'ignore');
      }
      if (gesture.type === 'pan') {
        tx = gesture.tx + dx;
        ty = gesture.ty + dy;
        clampPan();
        render();
      } else if (gesture.type === 'dismiss') {
        gesture.dismiss = dy;
        const travel = Math.min(Math.abs(dy) / 240, 1);
        chrome.style.opacity = String(1 - travel);
        viewer.style.backgroundColor = `rgba(0, 0, 0, ${1 - travel * 0.55})`;
        render(dy);
      }
    });

    function endPointer(event) {
      if (!pointers.has(event.pointerId)) return;
      try {
        if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
      } catch { /* pointer already gone */ }
      pointers.delete(event.pointerId);
      if (pointers.size >= 2) return;
      if (pointers.size === 1 && scale > 1) {
        const left = [...pointers.entries()][0];
        gesture = { type: 'pan', x: left[1].x, y: left[1].y, tx, ty, dismiss: 0, moved: true };
        return;
      }
      const ended = gesture;
      gesture = null;
      pointers.clear();
      if (!ended) return;
      if (ended.type === 'dismiss') {
        settleDismiss(ended.dismiss, event.pointerType);
        return;
      }
      viewer.classList.remove('dragging');
      if (scale <= 1.001) {
        scale = 1;
        tx = 0;
        ty = 0;
        render();
      }
      if (ended.moved || viewerKind === 'video' || event.pointerType === 'mouse') return;
      const now = performance.now();
      if (now - (endPointer.lastTap || 0) < 280) {
        endPointer.lastTap = 0;
        if (scale > 1) zoomAt(event.clientX, event.clientY, 1);
        else zoomAt(event.clientX, event.clientY, 2.5);
        return;
      }
      endPointer.lastTap = now;
    }

    stage.addEventListener('pointerup', endPointer);
    stage.addEventListener('pointercancel', endPointer);
    // Chrome turns an uncancelled swipe into a fling and drops clicks until it ends.
    viewer.addEventListener('touchmove', (event) => {
      if (viewer.hidden || onVideoControls(event)) return;
      if (event.target.closest?.('#viewer-info')) return;
      event.preventDefault();
    }, { passive: false });
    stage.addEventListener('dblclick', (event) => {
      if (viewer.hidden || viewerKind === 'video') return;
      event.preventDefault();
      zoomAt(event.clientX, event.clientY, scale > 1 ? 1 : 2.5);
    });
    stage.addEventListener('wheel', (event) => {
      if (viewer.hidden) return;
      event.preventDefault();
      const delta = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
      zoomAt(event.clientX, event.clientY, scale * Math.exp(-delta * 0.0016));
    }, { passive: false });

    function aspectOf(tile) {
      const media = tile.querySelector('img, video');
      const w = media?.naturalWidth || media?.videoWidth || Number(media?.getAttribute('width')) || 0;
      const h = media?.naturalHeight || media?.videoHeight || Number(media?.getAttribute('height')) || 0;
      if (w > 0 && h > 0) return w / h;
      return 1;
    }

    function layoutHits() {
      const list = document.getElementById('hits');
      if (!list) return;
      const tiles = [...list.querySelectorAll(':scope > .tile')];
      const width = list.clientWidth;
      if (!tiles.length || width <= 0) return;
      laidWidth = width;
      const aspects = tiles.map(aspectOf);
      // One square would take half a phone row. Cap the height so a wider window adds
      // columns instead of a fixed phone column with empty space beside it.
      const target = Math.min(220, Math.max(96, (width - GAP) / 2));
      const rows = [];
      let index = 0;
      while (index < tiles.length) {
        const row = [];
        let sum = 0;
        while (index < tiles.length) {
          const nextSum = sum + aspects[index];
          const nextCount = row.length + 1;
          const nextWidth = nextSum * target + GAP * (nextCount - 1);
          if (row.length && nextWidth > width) {
            const without = Math.abs((width - GAP * (row.length - 1)) / sum - target);
            const withIt = Math.abs((width - GAP * row.length) / nextSum - target);
            if (without <= withIt) break;
          }
          row.push(index);
          sum = nextSum;
          index += 1;
          if (nextWidth >= width) break;
        }
        rows.push(row);
      }
      let y = 0;
      rows.forEach((row, rowIndex) => {
        const sum = row.reduce((total, item) => total + aspects[item], 0);
        const natural = sum * target + GAP * (row.length - 1);
        // A lone leftover stays at the target height. Every other row fills the width.
        const scaleToWidth = rowIndex !== rows.length - 1 || row.length > 1 || natural > width;
        const rowHeight = scaleToWidth ? (width - GAP * (row.length - 1)) / sum : target;
        let x = 0;
        row.forEach((item, itemIndex) => {
          const lastInRow = itemIndex === row.length - 1;
          const tileWidth = lastInRow && scaleToWidth
            ? Math.max(1, width - x)
            : Math.max(1, Math.round(aspects[item] * rowHeight));
          const tile = tiles[item];
          tile.style.left = `${x}px`;
          tile.style.top = `${y}px`;
          tile.style.width = `${tileWidth}px`;
          tile.style.height = `${Math.max(1, Math.round(rowHeight))}px`;
          x += tileWidth + GAP;
        });
        y += Math.round(rowHeight) + GAP;
      });
      list.style.height = `${Math.max(0, y - GAP)}px`;
      list.classList.add('ready');
    }

    function queueLayout() {
      if (layoutQueued) return;
      layoutQueued = true;
      requestAnimationFrame(() => {
        layoutQueued = false;
        layoutHits();
      });
    }

    function relayoutIfWidthChanged() {
      const hits = document.getElementById('hits');
      const width = hits?.clientWidth || document.querySelector('main').clientWidth;
      if (Math.abs(width - laidWidth) < 1) return;
      queueLayout();
    }

    function maybeFireMore() {
      const more = document.getElementById('more');
      if (!more || paging) return;
      if (more.getBoundingClientRect().top > window.innerHeight + 280) return;
      paging = true;
      htmx.process(more);
      htmx.trigger(more, 'loadmore');
    }

    function ingestPage(html, sentinel) {
      const parsed = new DOMParser().parseFromString(html, 'text/html');
      const hits = document.getElementById('hits');
      if (hits) {
        for (const tile of parsed.querySelectorAll('.tile')) hits.append(tile);
      }
      const next = parsed.querySelector('#more');
      if (next) {
        sentinel.replaceWith(next);
        htmx.process(next);
      } else {
        sentinel.remove();
      }
      layoutHits();
      paging = false;
      maybeFireMore();
    }

    syncChrome();
    syncVeil();
    new ResizeObserver(syncVeil).observe(slot);
    new ResizeObserver(relayoutIfWidthChanged).observe(document.documentElement);
    window.addEventListener('resize', relayoutIfWidthChanged);

    if (tgWebApp) {
      tgWebApp.onEvent?.('themeChanged', () => {
        if (viewer.hidden) syncChrome();
      });
      tgWebApp.disableVerticalSwipes?.();
      tgWebApp.expand();
      try {
        if (fullScreenPlatforms.includes(tgWebApp.platform)) tgWebApp.requestFullscreen();
      } catch {
        // requestFullscreen not supported (Bot API < 8.0)
      }
      tgWebApp.BackButton?.onClick(closeViewer);
      tgWebApp.ready();
    }

    function showAuthError(message) {
      statusLine.textContent = message;
      statusLine.className = 'error';
    }

    async function authenticate() {
      const initData = tgWebApp?.initData ?? '';
      try {
        const response = await fetch('api/auth/telegram?' + new URLSearchParams({ init_data: initData }));
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = typeof body.detail === 'string' ? body.detail : '';
          const outsideTelegram = !initData && detail === 'Missing init_data';
          showAuthError(outsideTelegram ? 'Откройте приложение из Telegram' : (detail || `Ошибка входа: ${response.status}`));
          return;
        }
        token = body.token;
        statusLine.hidden = true;
        form.hidden = false;
        syncVeil();
      } catch (e) {
        showAuthError(`Ошибка входа: ${e.message}`);
      }
    }

    let tileTap = null;
    document.body.addEventListener('pointerdown', (event) => {
      tileTap = null;
      if (event.button !== 0 || event.pointerType === 'mouse') return;
      if (!viewer.hidden && !viewer.classList.contains('dismissed')) return;
      const opener = event.target.closest?.('[data-open]');
      if (!opener || viewer.contains(opener)) return;
      tileTap = { opener, x: event.clientX, y: event.clientY };
    });
    document.body.addEventListener('pointerup', (event) => {
      const tap = tileTap;
      tileTap = null;
      if (!tap || event.pointerType === 'mouse') return;
      if (Math.hypot(event.clientX - tap.x, event.clientY - tap.y) > 10) return;
      if (event.target.closest?.('[data-open]') !== tap.opener) return;
      openViewer(tap.opener);
    });
    document.body.addEventListener('pointercancel', () => { tileTap = null; });
    document.body.addEventListener('click', (event) => {
      const opener = event.target.closest?.('[data-open]');
      if (!opener || viewer.contains(opener)) return;
      if (!viewer.hidden && !viewer.classList.contains('dismissed')) return;
      openViewer(opener);
    });
    document.body.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeViewer();
    });
    document.getElementById('viewer-close').addEventListener('click', closeViewer);
    document.getElementById('viewer-save').addEventListener('click', () => {
      if (viewerFile) saveFile(viewerFile.url, viewerFile.name);
    });
    publicBtn.addEventListener('click', () => {
      if (viewerPublic) openPublic(viewerPublic);
    });
    infoBtn.addEventListener('click', () => {
      const show = info.hidden;
      info.hidden = !show;
      infoBtn.setAttribute('aria-pressed', String(show));
    });

    document.body.addEventListener('htmx:configRequest', (event) => {
      if (token) event.detail.headers['Authorization'] = `Bearer ${token}`;
    });
    document.body.addEventListener('htmx:beforeRequest', (event) => {
      if (event.detail.elt?.id !== 'search') return;
      document.getElementById('more')?.remove();
    });
    document.body.addEventListener('htmx:beforeSwap', (event) => {
      if (event.detail.xhr.status === 401) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
      }
      if (event.detail.target?.id !== 'more') return;
      if (event.detail.xhr.status >= 400) return;
      event.detail.shouldSwap = false;
      ingestPage(event.detail.serverResponse, event.detail.target);
    });
    document.body.addEventListener('htmx:afterSwap', (event) => {
      if (event.detail.target?.id !== 'results') return;
      window.scrollTo(0, 0);
      layoutHits();
      window.setTimeout(() => { maybeFireMore(); }, 50);
    });
    document.body.addEventListener('htmx:afterSettle', (event) => {
      if (event.detail.target?.id !== 'results') return;
      maybeFireMore();
    });
    document.body.addEventListener('htmx:afterRequest', (event) => {
      if (event.detail.successful || event.detail.elt?.id !== 'more') return;
      paging = false;
    });
    document.body.addEventListener('load', (event) => {
      if (event.target?.closest?.('#hits')) queueLayout();
    }, true);
    document.body.addEventListener('loadedmetadata', (event) => {
      if (event.target?.closest?.('#hits')) queueLayout();
    }, true);
    window.addEventListener('scroll', () => { maybeFireMore(); }, { passive: true });

    authenticate();
  </script>
</body>
</html>
